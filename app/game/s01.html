<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEN FIGHT — Loading</title><link rel="stylesheet" href="../assets/pen.css"><script src="../assets/pen.js"></script></head>
<body>
<div class="stage" data-w="941" data-h="1672">
<div data-scene="portrait"></div>
<!-- chalk circle + doodles on desk -->
<svg class="a" style="left:0;top:820px;width:941px;height:600px" viewBox="0 0 941 600" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="7" stroke-linecap="round">
 <ellipse cx="450" cy="170" rx="395" ry="170" stroke-dasharray="120 18 60 24 200 20" opacity=".85"/><ellipse cx="450" cy="170" rx="300" ry="115" stroke-width="3" opacity=".5"/>
 <path d="M300 130l130 70M520 90l-80 120" stroke-width="3" opacity=".5"/>
 <g stroke-width="5" opacity=".7" transform="translate(40 410)"><circle cx="90" cy="30" r="32"/><path d="M90 62v90M90 90L40 130M90 90l60-30M90 152l-45 60M90 152l50 40"/><path d="M80 25q10 14 22 0" stroke-width="3"/></g>
 <g stroke-width="4" opacity=".6" transform="translate(300 430)"><path d="M0 0l150-10 6 120-150 12z"/></g>
</svg>
<div data-books style="left:-14px;top:628px;transform:scale(1.25);transform-origin:left top"></div>
<div data-crumple style="left:772px;top:722px;width:190px;height:170px"></div>
<!-- wall scribble -->
<div class="a hand" style="left:20px;top:318px;width:140px;font:700 52px/1.15 var(--f-disp);color:#2a2a2a;text-shadow:none;text-align:center;opacity:.8">পেন<br>ফাইট<br>কিং<br>☺</div>
<!-- logo -->
<div data-logo style="--w:600px;left:195px;top:92px"></div>
<!-- pens on desk -->
<div data-pen="blue" data-label="KYAU" style="left:8px;top:870px;width:600px;transform:rotate(-12deg)"></div>
<div data-pen="red" style="left:420px;top:960px;width:520px;transform:rotate(12deg)"></div>
<!-- notepad -->
<div class="a" style="left:620px;top:1110px;width:320px;height:310px;transform:rotate(-8deg);background:linear-gradient(#f4dfae,#e8c98a);border-radius:10px;box-shadow:0 10px 18px rgba(0,0,0,.5);padding:30px 26px;color:#2a1a08;font:700 30px/1.7 var(--f-disp)">
 <div style="position:absolute;left:0;right:0;top:-14px;height:28px;background:repeating-linear-gradient(90deg,#444 0 5px,transparent 5px 26px);border-radius:8px;opacity:.85"></div>
 <div style="font-family:var(--f-latin);font-size:34px">Rule:</div>১. পেন ফেলাও<br>২. টেবিলে বাঁচাও<br>৩. শেষ পেন, সেই জয়ী!</div>
<!-- progress -->
<div class="a" style="left:0;width:941px;top:1458px;text-align:center;font:700 36px var(--f-latin);text-shadow:0 2px 4px rgba(0,0,0,.7)">Loading...</div>
<div class="bar a" style="left:106px;top:1520px;width:730px;height:46px;border:4px solid #3a3a46;background:#2a2630;border-radius:999px"><u id="ld" style="width:75%"></u><b class="a num" style="right:26px;top:0;line-height:38px;font-size:28px" id="ldn">75%</b></div>
<div class="a" style="left:0;right:0;bottom:30px;text-align:center;font:500 16px var(--f-latin);color:rgba(255,255,255,.7)">Tap anywhere to continue</div>
<div class="fill" data-go="s02" style="z-index:5"></div>
</div>
<script>
// fake loader: 0→100% then go to login
document.addEventListener('DOMContentLoaded',()=>{let p=75;const b=document.getElementById('ld'),n=document.getElementById('ldn');
 const t=setInterval(()=>{p+=1;b.style.width=p+'%';n.textContent=p+'%';if(p>=100){clearInterval(t);setTimeout(()=>PF.go('s02'),500)}},90)});
</script>
</body></html>
